name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Por defecto, permisos de solo lectura. El job de deploy pide los de escritura
# que necesita; así una PR de un fork nunca corre con scope de Pages.
permissions:
  contents: read

jobs:
  # Gate de calidad. Corre tanto en push a main como en cada PR, así nada llega
  # a main sin lint + checks de datos + unit tests + E2E contra dist/.
  validate:
    runs-on: ubuntu-latest
    # Un push nuevo a la misma rama cancela la corrida anterior; en main no,
    # porque esa corrida es la que habilita el deploy.
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Active LTS (soporte hasta 2028-04-30). Node 20 quedó EOL el
          # 2026-04-30 y Node 22 ya está en maintenance.
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run ci

      - name: Build site artifact
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests against dist
        run: npx playwright test

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    # Solo publica lo que ya pasó el gate, y solo desde main.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Se reconstruye acá en vez de arrastrar dist/ entre jobs: el build es
      # determinístico (?v= por hash de contenido) y tarda menos que subir y
      # bajar el artifact.
      - name: Build site artifact
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Only the public runtime files (dist/), never the whole repo
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
