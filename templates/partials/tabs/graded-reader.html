<div id="graded-reader" class="tab-panel" data-tab="graded-reader">
    <div class="reader-container">
        <!-- Banner / Header -->
        <div class="reader-header-banner">
            <div class="reader-title-group">
                <h2 class="reader-main-title">
                    <span class="reader-title-icon" style="display:inline-flex; align-items:center;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    </span>
                    <span data-i18n="gradedReaderTitle">Lector Graduado HSK</span>
                </h2>
                <p class="reader-subtitle" data-i18n="gradedReaderSubtitle">
                    Historias y lecturas adaptadas por nivel HSK con diccionario emergente interactivo y preguntas de comprensión.
                </p>
            </div>
            <div class="reader-controls-bar">
                <div class="reader-level-picker">
                    <label for="reader-level-select" data-i18n="readerLevelLabel">Nivel:</label>
                    <select id="reader-level-select" class="select-input">
                        <option value="1" selected>HSK 1 (Principiante)</option>
                        <option value="2">HSK 2 (Básico)</option>
                        <option value="3">HSK 3 (Intermedio)</option>
                        <option value="4">HSK 4 (Avanzado)</option>
                    </select>
                </div>
                <div class="reader-toggles-group">
                    <button id="reader-toggle-pinyin-btn" class="reader-btn-pill active" type="button" title="Mostrar/Ocultar Pinyin" style="display:inline-flex; align-items:center; gap:6px;">
                        <span class="reader-pill-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                        </span>
                        <span data-i18n="readerTogglePinyin">Pinyin: ON</span>
                    </button>
                    <button id="reader-read-aloud-btn" class="reader-btn-pill" type="button" title="Escuchar lectura en voz alta" style="display:inline-flex; align-items:center; gap:6px;">
                        <span class="reader-pill-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </span>
                        <span data-i18n="readerReadAloud">Leer en voz alta</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Story Selection List (Carousel / Chips) -->
        <div class="reader-story-selector" id="reader-story-chips"></div>

        <!-- Reading Canvas Card -->
        <div class="reader-article-card" id="reader-article-card">
            <div class="reader-article-header">
                <div class="reader-badge-wrap">
                    <span id="reader-story-level-badge" class="reader-level-badge">HSK 1</span>
                    <span id="reader-story-word-count" class="reader-meta-tag">120 palabras</span>
                </div>
                <h3 id="reader-story-title" class="reader-story-title">我的朋友李明</h3>
                <p id="reader-story-pinyin-title" class="reader-story-pinyin-title">Wǒ de péngyou Lǐ Míng</p>
            </div>

            <!-- Interactive Story Body -->
            <div id="reader-story-body" class="reader-story-body"></div>

            <!-- Floating Hover/Tap Word Tooltip -->
            <div id="reader-word-popover" class="reader-word-popover" style="display: none;" role="tooltip">
                <div class="rwp-header">
                    <span class="rwp-char" id="rwp-char">李明</span>
                    <span class="rwp-pinyin" id="rwp-pinyin">Lǐ Míng</span>
                    <button id="rwp-audio-btn" class="rwp-icon-btn" type="button" title="Pronunciar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                    <button id="rwp-fav-btn" class="rwp-icon-btn" type="button" title="Guardar en favoritos">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    </button>
                </div>
                <div class="rwp-meaning" id="rwp-meaning">Li Ming (nombre propio)</div>
            </div>

            <!-- Comprehension Quiz Section -->
            <div class="reader-quiz-section" id="reader-quiz-section">
                <div class="reader-quiz-header" style="display:flex; align-items:center; gap:6px;">
                    <span class="reader-quiz-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </span>
                    <h4 data-i18n="readerComprehensionTitle">Preguntas de Comprensión Lectora</h4>
                </div>
                <div id="reader-quiz-questions" class="reader-quiz-list"></div>
                <div id="reader-quiz-score-banner" class="reader-quiz-score-banner" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>
