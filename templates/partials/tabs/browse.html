                <!-- Browse Tab -->
                <div id="browse" class="tab-panel">
                    <div class="search-section">
                        <div class="search-container">
                            <input type="text" id="search-input" class="search-input"
                                placeholder="Search by character, pinyin or translation..."
                                data-i18n-placeholder="searchPlaceholder">
                            <select id="browse-level-filter" class="select-input" aria-label="Filtrar por nivel HSK">
                                <option value="all" data-i18n="allLevels">All levels</option>
                                <option value="1">HSK 1</option>
                                <option value="2">HSK 2</option>
                                <option value="3">HSK 3</option>
                                <option value="4">HSK 4</option>
                                <option value="5">HSK 5</option>
                                <option value="6">HSK 6</option>
                            </select>
                            <select id="browse-sort-order" class="select-input" aria-label="Ordenar resultados">
                                <option value="lesson" data-i18n="browseSortLesson" selected>Orden por lección</option>
                                <option value="alphabetical" data-i18n="browseSortAlphabetical">Orden alfabético</option>
                            </select>
                            <button type="button" id="export-anki-btn" class="btn btn-secondary" title="Exportar mazo a formato Anki CSV" data-i18n-title="exportAnkiTitle" style="display:inline-flex; align-items:center; gap:6px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                <span data-i18n="exportAnkiBtn">Exportar a Anki</span>
                            </button>
                            <button type="button" id="export-pdf-btn" class="btn btn-secondary" title="Generar PDF imprimible de tarjetas" data-i18n-title="exportPdfTitle" style="display:inline-flex; align-items:center; gap:6px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                <span data-i18n="exportPdfBtn">Exportar a PDF</span>
                            </button>
                            <button type="button" id="browse-select-mode-btn" class="btn btn-outline" title="Activar/desactivar modo de selección múltiple" data-i18n-title="toggleSelectModeTitle" style="display:inline-flex; align-items:center; gap:6px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 11 12 14 22 4"></polyline>
                                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                </svg>
                                <span id="browse-select-mode-text" data-i18n="selectWordsBtn">Seleccionar</span>
                                <span id="browse-selected-count-badge" class="badge-count" style="display:none;">0</span>
                            </button>
                        </div>
                    </div>

                    <div id="browse-selection-bar" class="selection-floating-bar" style="display:none;">
                        <div class="selection-bar-info">
                            <span id="browse-selected-text">0 seleccionadas</span>
                        </div>
                        <div class="selection-bar-actions">
                            <button type="button" id="browse-select-all-btn" class="btn btn-sm btn-outline" data-i18n="selectAll">Seleccionar todo</button>
                            <button type="button" id="browse-clear-selection-btn" class="btn btn-sm btn-outline" data-i18n="deselectAll">Deseleccionar</button>
                            <button type="button" id="browse-print-selected-btn" class="btn btn-sm btn-primary" style="display:inline-flex; align-items:center; gap:5px;">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                    <rect x="6" y="14" width="12" height="8"></rect>
                                </svg>
                                <span id="browse-print-selected-text">Generar PDF (0)</span>
                            </button>
                        </div>
                    </div>

                    <div class="browse-stats" id="browse-stats"></div>

                    <div class="vocabulary-grid" id="vocabulary-grid">
                        <!-- Vocabulary cards will be populated here -->
                    </div>
                </div>
