<div id="sentence-builder" class="tab-panel" data-tab="sentence-builder">
    <div class="sentence-builder-container">
        <!-- Game Header / Banner -->
        <div class="sb-header-banner">
            <div class="sb-title-group">
                <h2 class="sb-main-title">
                    <span class="sb-title-icon" aria-hidden="true">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19.439 7.85c-.049-.915-.28-1.782-.676-2.56L15.5 6.5a2 2 0 0 1-2.828 0l-.707-.707a2 2 0 0 1 0-2.828L13.207.727A8.04 8.04 0 0 0 10.647.051C6.223.051 2.64 3.633 2.64 8.058c0 1.25.29 2.433.805 3.486L4.5 10.5a2 2 0 0 1 2.828 0l.707.707a2 2 0 0 1 0 2.828l-1.055 1.055a8.04 8.04 0 0 0 2.56.676c.915.049 1.782.28 2.56.676l-1.242 3.242a2 2 0 0 1 0 2.828l.707.707a2 2 0 0 1 2.828 0l1.055-1.055a8.04 8.04 0 0 0 3.486-.805c4.425 0 8.007-3.582 8.007-8.007 0-.915-.227-1.782-.676-2.56l-3.242 1.242a2 2 0 0 1-2.828 0l-.707-.707a2 2 0 0 1 0-2.828l1.242-3.242Z"></path>
                        </svg>
                    </span>
                    <span data-i18n="sentenceBuilderTitle">Constructor de Oraciones</span>
                </h2>
                <p class="sb-subtitle" data-i18n="sentenceBuilderSubtitle">
                    Ordena las palabras en mandarín para construir la oración correcta según su significado.
                </p>
            </div>
            <div class="sb-stats-bar">
                <div class="sb-stat-item">
                    <span class="sb-stat-label" data-i18n="sentenceBuilderScore">Puntaje:</span>
                    <span id="sb-score-val" class="sb-stat-val">0</span>
                </div>
                <div class="sb-stat-item">
                    <span class="sb-stat-label" data-i18n="sentenceBuilderStreak">Racha:</span>
                    <span class="sb-stat-val" style="display:inline-flex; align-items:center; gap:3px;">
                        <span id="sb-streak-val">0</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary);" aria-hidden="true">
                            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                        </svg>
                    </span>
                </div>
                <div id="sb-timer-box" class="sb-stat-item" style="display: none;">
                    <span class="sb-stat-label" data-i18n="sentenceBuilderTime">Tiempo:</span>
                    <span id="sb-timer-val" class="sb-stat-val">60s</span>
                </div>
            </div>
        </div>

        <!-- Controls / Configuration -->
        <div class="sb-controls-card">
            <div class="sb-control-group">
                <label for="sb-level-select" data-i18n="sentenceBuilderLevelLabel">Nivel HSK:</label>
                <select id="sb-level-select" class="select-input">
                    <option value="all" data-i18n="sentenceBuilderAllLevels">Todos los Niveles</option>
                    <option value="1">HSK 1</option>
                    <option value="2">HSK 2</option>
                    <option value="3">HSK 3</option>
                    <option value="4">HSK 4</option>
                    <option value="5">HSK 5</option>
                    <option value="6">HSK 6</option>
                </select>
            </div>

            <div class="sb-control-group">
                <label for="sb-mode-select" data-i18n="sentenceBuilderModeLabel">Modo de Juego:</label>
                <select id="sb-mode-select" class="select-input">
                    <option value="practice" data-i18n="sentenceBuilderModePractice">Práctica Libre</option>
                    <option value="time-attack" data-i18n="sentenceBuilderModeTimeAttack">Contrarreloj (60s)</option>
                </select>
            </div>

            <button id="sb-start-btn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span data-i18n="sentenceBuilderStartBtn">Comenzar</span>
            </button>
        </div>

        <!-- Interactive Game Arena -->
        <div id="sb-arena" class="sb-arena" style="display: none;">
            <!-- Target Meaning Card -->
            <div class="sb-meaning-card">
                <span class="sb-target-badge" data-i18n="sentenceBuilderTargetLabel">Traduce al chino:</span>
                <div id="sb-target-meaning" class="sb-target-meaning">---</div>
                <div id="sb-pinyin-reveal" class="sb-pinyin-reveal" style="display: none;"></div>
            </div>

            <!-- Target Slots (Where selected words go) -->
            <div class="sb-target-container">
                <div id="sb-target-slots" class="sb-target-slots">
                    <span id="sb-empty-prompt" class="sb-empty-prompt" data-i18n="sentenceBuilderDropPrompt">
                        Haz clic en las fichas inferiores para armar la oración aquí...
                    </span>
                </div>
            </div>

            <!-- Bank of Word Tiles -->
            <div class="sb-bank-container">
                <div id="sb-tiles-bank" class="sb-tiles-bank">
                    <!-- Shuffled tiles will be rendered dynamically -->
                </div>
            </div>

            <!-- Action Buttons Bar -->
            <div class="sb-actions-bar">
                <button id="sb-clear-btn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    <span data-i18n="sentenceBuilderClearBtn">Reiniciar Fichas</span>
                </button>

                <button id="sb-hint-btn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span data-i18n="sentenceBuilderHintBtn">Pista</span>
                </button>

                <button id="sb-listen-btn" class="btn btn-secondary" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <span data-i18n="sentenceBuilderListenBtn">Escuchar</span>
                </button>

                <button id="sb-check-btn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span data-i18n="sentenceBuilderCheckBtn">Comprobar</span>
                </button>

                <button id="sb-next-btn" class="btn btn-primary" style="display: none;">
                    <span data-i18n="sentenceBuilderNextBtn">Siguiente Oración</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 4px;">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Feedback Alert -->
            <div id="sb-feedback" class="sb-feedback" style="display: none;"></div>
        </div>

        <!-- Game Over Modal / Summary Screen -->
        <div id="sb-game-over" class="sb-game-over-card" style="display: none;">
            <div class="sb-game-over-icon" style="display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; border-radius:50%; background:rgba(250,204,21,0.15); color:var(--color-accent, #facc15); margin:0 auto 12px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            </div>
            <h3 class="sb-game-over-title" data-i18n="sentenceBuilderGameOverTitle">¡Fin del Tiempo!</h3>
            <div class="sb-game-over-stats">
                <div class="sb-go-stat">
                    <span class="sb-go-label" data-i18n="sentenceBuilderScore">Puntaje Final:</span>
                    <span id="sb-final-score" class="sb-go-val">0</span>
                </div>
                <div class="sb-go-stat">
                    <span class="sb-go-label" data-i18n="sentenceBuilderStreak">Mejor Racha:</span>
                    <span id="sb-final-streak" class="sb-go-val">0</span>
                </div>
            </div>
            <button id="sb-play-again-btn" class="btn btn-primary">
                <span data-i18n="sentenceBuilderPlayAgainBtn">Jugar de Nuevo</span>
            </button>
        </div>
    </div>
</div>
